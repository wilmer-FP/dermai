[pytest]
# `backend` permite importar el paquete `app`; `.` permite importar el paquete `ai`.
pythonpath = backend .
testpaths = tests/backend tests/ai
markers =
    integration: requiere PostgreSQL en ejecución (se omite si no está disponible)
filterwarnings =
    # Aviso interno de Starlette (TestClient) sobre un alias de anyio; no depende de DermAI.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
